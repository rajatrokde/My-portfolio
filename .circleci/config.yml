version: 2.1

orbs:
  gh-pages: circleci/gh-pages@1.8.0

jobs:
  build:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Check Website Files
          command: |
            echo "Checking website files..."
            ls -la

            if [ ! -f index.html ]; then
              echo "ERROR: index.html not found!"
              exit 1
            fi

            echo "index.html found successfully."

  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Verify Website
          command: |
            if [ ! -f index.html ]; then
              echo "ERROR: index.html not found!"
              exit 1
            fi

            echo "Website is ready for deployment."

      - gh-pages/deploy:
          repo: << pipeline.project.git_url >>
          ssh-fingerprint: "<<SSH-FINGERPRINT>>"
          source: "."
          branch: "gh-pages"

workflows:
  deploy_website:
    jobs:
      - build

      - deploy:
          requires:
            - build
